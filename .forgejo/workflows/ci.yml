on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: git.emilio-mendoza.lan/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Push image
        run: |
          echo "${{ secrets.CI_TOKEN }}" | docker login git.emilio-mendoza.lan -u ${{ github.actor }} --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
